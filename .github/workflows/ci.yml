name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # The title and description are untrusted (public repository): the script reads
      # them from the event file, nothing from the PR is interpolated in this shell.
      - name: PR title and changelog entry
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/changelog.py title --event "$GITHUB_EVENT_PATH"
          uv run python scripts/changelog.py sync --event "$GITHUB_EVENT_PATH" --check

      - name: Lint + type check + data audit (pre-commit)
        run: uv run pre-commit run --all-files

      - name: Tests
        run: uv run pytest -q
