[project]
name = "open-coach"
version = "0.2.0"
description = "Open Coach - AI endurance coach as an MCP server, with watch-platform integrations (Garmin today)"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
authors = [{name = "Jonathan Cattelain"}]
readme = "README.md"
keywords = ["coaching", "running", "training", "vdot", "garmin", "strava", "mcp", "mcp-server", "claude-code", "cursor", "codex", "gemini-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "garminconnect>=0.3.0",
    "fastmcp>=3.3.1",
    "pydantic>=2.0",
]

[project.scripts]
open-coach = "open_coach.server:main"

[project.urls]
Homepage = "https://github.com/d474b3r9/open-coach"
Repository = "https://github.com/d474b3r9/open-coach"
Issues = "https://github.com/d474b3r9/open-coach/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Keep in sync with ruff-pre-commit rev in .pre-commit-config.yaml
    "ruff>=0.15,<0.16",
    "mypy>=1.10",
    "pre-commit>=4.0",
]

[project.optional-dependencies]
transcripts = [
    "youtube-transcript-api>=1.2,<2.0",
]
reauth = [
    "seleniumbase>=4.30",
    "curl_cffi>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_coach"]

# Ship the coaching guides (skills) inside the package so a wheel install can
# serve them over MCP (see open_coach.guides).
[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "open_coach/_guides"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -p no:seleniumbase"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF", "PT", "ARG", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["open_coach"]

[tool.ruff.lint.per-file-ignores]
# Test doubles implement real interfaces — unused args are part of the contract.
# ASYNC240: tests are sync-in-effect (pytest-asyncio), blocking Path I/O on tmp_path is fine.
"tests/**" = ["ARG001", "ARG002", "ASYNC240", "RUF001"]
# The × sign is the literal character used in plan descriptions the parser must match.
"src/open_coach/plan_to_dsl.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "garminconnect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["seleniumbase.*", "curl_cffi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test bodies are checked (check_untyped_defs) but full signature annotation
# of ~400 test functions buys nothing — keep strict signatures for src/ and scripts/.
module = "tests.*"
disallow_untyped_defs = false
