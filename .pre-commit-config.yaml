repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version pinned in pyproject.toml [dependency-groups] dev
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: Type check (mypy)
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: audit-docs
        name: Personal data audit
        entry: uv run python scripts/audit_docs.py
        language: system
        pass_filenames: false
